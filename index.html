<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP Chatbot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 400px;
            max-width: 90%;
            height: 600px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #4a90e2;
            color: #ffffff;
            padding: 16px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .bot-message {
            background-color: #e9ecef;
            color: #333333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .user-message {
            background-color: #4a90e2;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .input-container {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e0e0e0;
            background: #fafafa;
        }
        .input-container input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 0.95rem;
        }
        .input-container button {
            margin-left: 8px;
            padding: 10px 18px;
            border: none;
            background-color: #4a90e2;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .input-container button:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        🤖 NLP Assistant
    </div>
    <div class="chat-box" id="chatBox">
        <div class="message bot-message">
            Hello! How can I help you today?
        </div>
    </div>
    <div class="input-container">
        <input type="text" id="userInput" placeholder="Type a message..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const messageText = inputField.value.trim();

        if (messageText === "") return;

        // Display User Message
        const userDiv = document.createElement('div');
        userDiv.className = 'message user-message';
        userDiv.textContent = messageText;
        chatBox.appendChild(userDiv);

        inputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Send request to Flask Python Backend
            const response = await fetch('/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ message: messageText }),
            });
            const data = await response.json();

            // Display Bot Response
            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-message';
            botDiv.textContent = data.response;
            chatBox.appendChild(botDiv);
        } catch (error) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'message bot-message';
            errorDiv.textContent = "Error communicating with server.";
            chatBox.appendChild(errorDiv);
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
